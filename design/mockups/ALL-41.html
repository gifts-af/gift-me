<title>GiftMe mock-ups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a review page (header, sign-off, screen picker) around one screen at a time,
   shown inside a phone, popup, email or computer frame. Tokens are design/ui.md > Colours. */
:root {
  --background: #ffffff;
  --foreground: #18181b;
  --card: #ffffff;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --border: #e4e4e7;
  --input: #e4e4e7;
  --primary: #0f766e;
  --primary-foreground: #ffffff;
  --accent: #f0fdfa;
  --accent-foreground: #0f766e;
  --secondary: #f4f4f5;
  --secondary-foreground: #18181b;
  --destructive: #b91c1c;
  --success: #15803d;
  --warning: #b45309;
  --success-soft: #f0fdf4;
  --warning-soft: #fffbeb;
  --ring: var(--primary);
  --stage: #fafafa;
  --overlay: rgb(9 9 11 / 0.4);
  --radius: 0.75rem;
  --radius-sm: 0.5rem;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #09090b; --foreground: #fafafa; --card: #18181b; --muted: #27272a;
    --muted-foreground: #a1a1aa; --border: #27272a; --input: #27272a; --primary: #2dd4bf;
    --primary-foreground: #042f2e; --accent: #042f2e; --accent-foreground: #5eead4;
    --secondary: #27272a; --secondary-foreground: #fafafa; --destructive: #f87171;
    --success: #4ade80; --warning: #fbbf24; --success-soft: #052e16; --warning-soft: #2a1d05;
    --stage: #111113; --overlay: rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #09090b; --foreground: #fafafa; --card: #18181b; --muted: #27272a;
  --muted-foreground: #a1a1aa; --border: #27272a; --input: #27272a; --primary: #2dd4bf;
  --primary-foreground: #042f2e; --accent: #042f2e; --accent-foreground: #5eead4;
  --secondary: #27272a; --secondary-foreground: #fafafa; --destructive: #f87171;
  --success: #4ade80; --warning: #fbbf24; --success-soft: #052e16; --warning-soft: #2a1d05;
  --stage: #111113; --overlay: rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--stage);
  color: var(--foreground);
  font: 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ── Review chrome ─────────────────────────────────────────────── */
.review { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
.review-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.review-head h1 { font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
.review-head p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 15px; max-width: 60ch; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--background); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--secondary); font-weight: 600; }
.signoff { border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); padding: 12px 16px; font-size: 14px; display: grid; gap: 6px; }
.signoff strong { font-variant-numeric: tabular-nums; }
.signoff .waiting { color: var(--muted-foreground); font-size: 13px; }
.picker { display: grid; gap: 10px; }
.picker-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.picker-group > span { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); min-width: 96px; }
.chip { border: 1px solid var(--border); background: var(--background); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-current="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--border); }
.chip .dot.half { background: var(--warning); }
.chip .dot.done { background: var(--success); }
.stage { display: grid; gap: 16px; justify-items: center; }
.screen-note { font-size: 14px; color: var(--muted-foreground); max-width: 60ch; text-align: center; margin: 0; }
.variants { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ── Frames ────────────────────────────────────────────────────── */
.phone, .popup, .mail, .wide {
  background: var(--background);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  width: 100%;
}
.phone { max-width: 375px; border-radius: 32px; min-height: 700px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgb(0 0 0 / .08); }
.popup { max-width: 360px; border-radius: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / .12); }
.mail { max-width: 600px; border-radius: 8px; }
.wide { max-width: 1024px; border-radius: 12px; container-type: inline-size; }

/* ── App parts (what the real app will use) ────────────────────── */
.app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; min-height: 56px; border-bottom: 1px solid var(--border); }
.topbar .brand { font-weight: 700; font-size: 17px; }
.topbar .links { display: flex; gap: 20px; font-size: 15px; }
.topbar .links a { color: var(--muted-foreground); text-decoration: none; }
.topbar .links a[aria-current="page"] { color: var(--foreground); font-weight: 600; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; color: var(--foreground); }
.iconbtn:hover { background: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; border: 0; background: none; padding: 0 8px 0 0; color: var(--foreground); font-size: 15px; cursor: pointer; }
.body { padding: 16px; display: flex; flex-direction: column; gap: 24px; flex: 1; }
.section { display: flex; flex-direction: column; gap: 12px; }
.title { font-size: 22px; font-weight: 700; line-height: 1.25; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.h2 { font-size: 17px; font-weight: 600; margin: 0; }
.meta { font-size: 13px; color: var(--muted-foreground); margin: 0; }
.muted { color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

.card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 12px; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; color: inherit; font-size: 16px; }
button.card, a.card { cursor: pointer; text-decoration: none; }
button.card:hover, a.card:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.card.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.card-title { font-size: 15px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.card-sub { font-size: 13px; color: var(--muted-foreground); margin: 2px 0 0; }
.price { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.img { flex: none; width: 56px; height: 56px; border-radius: var(--radius-sm); background: var(--muted); display: grid; place-items: center; color: var(--muted-foreground); }
.img.lg { width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%; }
.check { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--input); display: grid; place-items: center; color: transparent; }
.selected .check { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-foreground); white-space: nowrap; }
.pill-muted { background: var(--muted); color: var(--muted-foreground); }
.pill-warn { background: var(--warning-soft); color: var(--warning); }
.pill-ok { background: var(--success-soft); color: var(--success); }

.btn-primary, .btn-secondary { min-height: 48px; padding: 0 20px; border-radius: var(--radius); border: 1px solid transparent; font-weight: 600; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn-link { border: 0; background: none; color: var(--muted-foreground); font-size: 15px; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; }
.btn-link.danger { color: var(--destructive); }
.block { width: 100%; }
.dock { position: sticky; bottom: 0; margin-top: auto; padding: 12px 16px 16px; background: var(--background); border-top: 1px solid var(--border); display: grid; gap: 4px; justify-items: center; }

label.field, .field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.input, textarea.input { width: 100%; min-height: 44px; border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--background); padding: 10px 12px; font-size: 16px; font-weight: 400; }
textarea.input { min-height: 88px; resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.field-error { color: var(--destructive); font-size: 13px; font-weight: 400; margin: 0; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted-foreground); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }

.list { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.kv { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); }
.kv > div { display: flex; gap: 12px; align-items: center; padding: 12px; min-height: 48px; }
.kv > div + div { border-top: 1px solid var(--border); }
.kv .k { font-size: 13px; color: var(--muted-foreground); width: 72px; flex: none; }
.kv .v { flex: 1; min-width: 0; font-size: 15px; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; flex: none; }
.toggle button { border: 0; background: none; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-foreground); font-weight: 600; }
.toggle button.drop[aria-pressed="true"] { background: var(--muted); color: var(--foreground); }
.banner { border-radius: var(--radius); padding: 12px; font-size: 14px; background: var(--muted); }
.banner.accent { background: var(--accent); color: var(--accent-foreground); }

.scrim { position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: flex-end; z-index: 5; }
.scrim.center { align-items: center; justify-content: center; padding: 16px; }
.scrim:not([data-open]) { display: none; }
.sheet { background: var(--card); width: 100%; border-radius: 20px 20px 0 0; padding: 8px 16px 16px; display: grid; gap: 16px; box-shadow: 0 -8px 24px rgb(0 0 0 / .12); }
.sheet::before { content: ""; justify-self: center; width: 40px; height: 4px; border-radius: 99px; background: var(--border); }
.dialog { background: var(--card); border-radius: var(--radius); padding: 20px; display: grid; gap: 16px; width: 100%; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--border); background: var(--background); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: 14px; cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--primary); background: var(--accent); color: var(--accent-foreground); font-weight: 600; }

/* Computer-width grids: 2 columns from 768 px, 3 from 1024 px of frame width. */
@container (min-width: 768px) { .wide .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .wide .body { padding: 24px 32px; } }
@container (min-width: 1000px) { .wide .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ── Feedback panel ────────────────────────────────────────────── */
.feedback { width: 100%; max-width: 640px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); padding: 16px; display: grid; gap: 14px; }
.feedback h2 { font-size: 17px; margin: 0; }
.fb-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.fb-approvals { display: flex; gap: 16px; font-size: 14px; }
.fb-approvals .yes { color: var(--success); font-weight: 600; }
.fb-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.fb-list li { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 2px; }
.fb-list .who { font-size: 13px; font-weight: 600; }
.fb-list .when { font-size: 12px; color: var(--muted-foreground); font-weight: 400; }
.fb-list .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.fb-msg { font-size: 13px; color: var(--muted-foreground); margin: 0; }
.fb-msg.err { color: var(--destructive); }
</style>

<div class="review">
  <header class="review-head">
    <div>
      <h1>GiftMe mock-ups</h1>
      <p>Tap through the screens. Leave comments and approve each one below it. Example people and gifts are made up.</p>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-set="system" aria-pressed="true">System</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <section class="signoff" id="signoff" aria-live="polite">
    <div>Sign-off: <strong id="signoff-count">loading…</strong></div>
    <div class="waiting" id="signoff-waiting"></div>
  </section>

  <nav class="picker" id="picker" aria-label="Screens"></nav>

  <main class="stage" id="stage">
<!-- screens:start -->
<!-- screens:end -->
  </main>
</div>

<script>
// Inline icons (lucide shapes, 20 px, stroke = currentColor).
const ICONS = {
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  next: '<path d="m9 18 6-6-6-6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  pencil: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/>',
};
function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach((el) => {
    if (el.firstElementChild) return;
    const size = el.dataset.size || 20;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[el.dataset.icon] || ''}</svg>`;
  });
}

// Theme switch for reviewers (per browser only).
function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch { return null; } }
function setTheme(mode) {
  if (mode === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
  store('mock-theme', mode);
}
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));
setTheme(store('mock-theme') || 'system');

// Screens: one visible at a time; the hash names it.
const screens = () => [...document.querySelectorAll('.screen')];
let current = null;
function show(id) {
  const all = screens();
  const target = all.find((s) => s.dataset.screen === id) || all[0];
  if (!target) return;
  all.forEach((s) => { s.hidden = s !== target; });
  current = target.dataset.screen;
  document.querySelectorAll('.chip[data-pick]').forEach((c) => c.setAttribute('aria-current', String(c.dataset.pick === current)));
  if (location.hash.slice(1) !== current) history.replaceState(null, '', '#' + current);
  document.dispatchEvent(new CustomEvent('screenchange', { detail: { id: current } }));
}
function buildPicker() {
  const groups = {};
  screens().forEach((s) => { (groups[s.dataset.group] ||= []).push(s); });
  const picker = document.getElementById('picker');
  picker.innerHTML = '';
  Object.entries(groups).forEach(([name, list]) => {
    const g = document.createElement('div');
    g.className = 'picker-group';
    const label = document.createElement('span');
    label.textContent = name;
    g.append(label);
    list.forEach((s) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.pick = s.dataset.screen;
      b.innerHTML = '<i class="dot"></i>';
      b.append(document.createTextNode(s.dataset.title));
      b.addEventListener('click', () => { show(s.dataset.screen); document.getElementById('stage').scrollIntoView({ block: 'start' }); });
      g.append(b);
    });
    picker.append(g);
  });
}
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); show(go.dataset.go); }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

// Sheets and dialogs inside a frame: data-open-sheet="<id>" opens, data-close closes.
document.addEventListener('click', (e) => {
  const opener = e.target.closest('[data-open-sheet]');
  if (opener) { document.getElementById(opener.dataset.openSheet)?.setAttribute('data-open', ''); return; }
  const closer = e.target.closest('[data-close]');
  if (closer) { closer.closest('.scrim')?.removeAttribute('data-open'); return; }
  if (e.target.classList?.contains('scrim')) e.target.removeAttribute('data-open');
});

// Variant switches above a frame: data-variant="<screen>:<name>" toggles data-<name> on that screen.
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-variant]');
  if (!v) return;
  const [id, name] = v.dataset.variant.split(':');
  const s = document.querySelector(`.screen[data-screen="${id}"]`);
  const on = v.getAttribute('aria-pressed') !== 'true';
  v.setAttribute('aria-pressed', String(on));
  s.toggleAttribute('data-' + name, on);
});

// screens-js:start
// screens-js:end

paintIcons();
buildPicker();
show(location.hash.slice(1));
</script>
