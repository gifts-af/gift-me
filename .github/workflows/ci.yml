name: CI

on:
  # The PR title check lives in pr-title.yml, so editing a title doesn't re-run
  # everything here (ALL-117).
  pull_request:
  push:
    branches: [main]
    # Docs are pushed straight to main and change no code, so they don't need
    # the tests (ALL-117). PRs aren't filtered: "check" is required to merge,
    # and a filtered-out run would leave it waiting forever.
    paths-ignore:
      - "planning/**"
      - "design/**"
      - "**/*.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  # Database: apply every migration to a fresh local Supabase, run the SQL
  # tests (privacy rules, keys, cascades) and the Vitest local-db tests, and
  # check the generated types are current. The runner has Docker, which the
  # Supabase CLI needs. The local-db tests call the Supabase API (PostgREST
  # through Kong, and auth), so the stack starts with them, like e2e; in CI a
  # missing stack fails those tests instead of skipping them.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - run: pnpm db:test
      - run: pnpm test:db
      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/core/src/database.types.ts \
            || { echo "::error::Run 'pnpm db:types' and commit packages/core/src/database.types.ts."; exit 1; }

  # Migrations (ALL-79, T50): after a merge to main, apply new migrations to
  # dev, then to prod only if dev succeeded. Vercel deploys the code at the same
  # time, so every migration must be expand-then-contract (E7).
  # Off switch: set the repo variable MIGRATE_ON_MERGE to "off".
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MIGRATE_ON_MERGE != 'off'
    needs: db
    runs-on: ubuntu-latest
    concurrency:
      group: migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The token reaches only these two steps, never install scripts.
      - run: pnpm db:push:dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: pnpm db:push:prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # Browser tests (ALL-20): a production build of apps/web against a fresh
  # local Supabase, at phone width. Only the services sign-in needs are started.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Point the app and tests at the local Supabase
        run: |
          eval "$(pnpm -s supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # Cloudflare's always-pass Turnstile test key, baked into the build (ALL-68).
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            # Any value: the browser tests replace Google's sign-in script (ALL-24).
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=e2e-fake-client-id"
          } >> "$GITHUB_ENV"
      # Browsers are cached until the lockfile changes; the download sometimes
      # hung for an hour (ALL-100). The system packages still come from apt, whose
      # mirror can be slow (7+ min seen), so the 15-minute timeouts (about 2x that) stop
      # a stall, not a slow run.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm --filter @gifts-af/web exec playwright install --with-deps chromium webkit
      - name: Install Playwright system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: pnpm --filter @gifts-af/web exec playwright install-deps chromium webkit
      - run: pnpm --filter @gifts-af/web build
      - run: pnpm --filter @gifts-af/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
