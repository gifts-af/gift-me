name: PR title

# Its own workflow so that fixing a title re-runs only this, not the whole of
# ci.yml (ALL-117). Required to merge, like ci.yml's "check".
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squash commit on main (CLAUDE.md > Git).
      - name: PR title follows Conventional Commits and names its ticket
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|ci|perf)(\([a-z0-9-]+\))?!?: .+ \(ALL-[0-9]+(, ALL-[0-9]+)*\)$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" should look like \"feat: what changed (ALL-19)\". See CLAUDE.md > Git."
            exit 1
          fi

  # A PR that changes how a gift round moves updates the round engine page, or
  # says why not in its body (CLAUDE.md > The round engine page). It lives here,
  # not in ci.yml, because editing the PR body should re-run only this.
  round-page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm round-page:check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
